services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-prompt-hub
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=super-secret-jwt-key-never-share
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
